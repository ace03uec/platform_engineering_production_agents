name: workshop-agent

# Incident agent stack: exactly one agent version at a time.
#
# Agent versions live in agent/<version>/ (agent/v0, agent/v1, ...), each a
# self-contained agent with its own Dockerfile. Select the version to build
# and run with AGENT_VERSION (default: v0):
#
#   AGENT_VERSION=v1 docker compose -f docker-compose-agent.yml up --build -d --wait
#
# Or pin it in a .env file next to this compose file (note: this .env is for
# compose variable substitution; the agent's runtime API keys live in
# agent/.env, see env_file below):
#
#   echo 'AGENT_VERSION=v1' >> .env
#
# Every version builds to its own image tag (workshop-agent:v0, :v1, ...), so
# rolling back is re-running up with the previous AGENT_VERSION -- no rebuild
# needed. Old images stay until you remove them.
#
# Requires the app stack (docker-compose-app.yml) to be running first: the
# agent joins its workshop-net network and probes app, prometheus and
# otel-collector by service name. Bring the agent down before the app stack.

services:
  agent:
    build:
      context: ./agent/${AGENT_VERSION:-v0}
    image: workshop-agent:${AGENT_VERSION:-v0}
    container_name: workshop-agent
    restart: unless-stopped
    init: true
    env_file:
      # Runtime secrets (model API keys), shared by all versions. Copy a
      # version's .env.example to agent/.env and fill it in.
      - path: ./agent/.env
        required: false
    environment:
      APP_URL: http://app:8080
      PROMETHEUS_URL: http://prometheus:9090
      DATA_DIR: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - agent-data:/data
      - workspace-data:/workspace
      - eval-data:/evals
    ports:
      - "127.0.0.1:${AGENT_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # Created by docker-compose-app.yml. External so the agent's lifecycle
  # (up/down/version switches) never affects the app stack's network.
  default:
    external: true
    name: workshop-net

volumes:
  # Fixed name (not project-prefixed): incident state in /data survives
  # version switches and compose project renames. One agent replica expected.
  agent-data:
    name: workshop-agent-data
  workspace-data:
    name: workshop-workspace
  eval-data:
    name: workshop-agent-evals
